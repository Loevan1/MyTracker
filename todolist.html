<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil</title>
    
<link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <h1><a href="index.html"></a>MyTracker</h1>
    </header>
    <h2>Nouvelle tâche</h2>
    <div id="nouvelle_tache">
        <input type="text" id="new_tache" placeholder="Nouvelle tâche">
        <select id="categories">
            <option value="études">🎓 Etudes</option>
            <option value="perso">👨 Perso</option>
            <option value="loisirs">🎯 Loisirs</option>
        </select>
        <div class="slider-container">
            <label for="dureeRange">Durée :</label>
            <input type="range" id="dureeRange" min="1" max="3" step="1" value="2">
            <div class="labels">
                <span>Court</span>
                <span>Moyen</span>
                <span>Long</span>
            </div>
        </div>
        <input type="date" name="" id=""> 
        <button type="button" onclick="creer_tache()">Créer</button>
        
        
     </div>
     <div id="container"></div>


     

        <footer>
            <div id="foot">
            <a href="index.html">Accueil</a>
            <a href="todolist.html">Tâches</a>
            <a href="timer_complet.html">Timer</a>
            <a href="stats.html">Stats</a>
            </div>
        </footer>

<script src="script.js"></script>
</body>
</html>
