<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes tâches</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <h1><a href="index.html"></a>MyTracker</h1>
    </header>
    
    <div id="nouvelle_tache">
        <input type="text" id="new_tache" class="input" placeholder="Nouvelle tâche">
        <select id="categories" class="input">
            <option value="études">🎓 Etudes</option>
            <option value="perso">👨 Perso</option>
            <option value="loisirs">🎯 Loisirs</option>
        </select>
        <label class="custom-checkbox">
  <input id="important" type="checkbox">
  <span class="checkbox-text">Important</span>
</label>
        <div class="slider-container">
            <label for="dureeRange">Durée :</label>
            <input type="range" id="dureeRange" min="1" max="3" step="1" value="2">
            <div class="labels">
                <span>Court</span>
                <span>Moyen</span>
                <span>Long</span>
            </div>
        </div>
        <input type="date" name="" id="" class="input"> 
        <button type="button" id='creer' onclick="creer_tache()">Créer</button>
        
        
     </div>
     <div id="container"></div>


     

        <footer>
            <div id="foot">
            <a href="index.html"><img src="icones/home1.png" id="icone"></a>
            <a href="todolist.html"><img src="icones/taches2.png" id="icone"></a>
            <a href="habitudes.html"><img src="icones/habitudes2.png" id="icone"></a>
            <a href="sommeil.html"><img src="icones/sommeil1.png" id="icone"></a>
            <a href="timer_complet.html"><img src="icones/timer1.png" id="icone"></a>
            
            <a href="javascript:void(0)" onclick="toggleMenu()"><img src="icones/nav1.png" id="icone"></a>
            
            </div>
        </footer>
    
<div id="moreMenu" class="side-menu">
    <div class="menu-header">
        <h3>Plus d'outils</h3>
        <button onclick="toggleMenu()" class="close-btn">✕</button>
    </div>
    <div class="menu-content">
        <a href="notes.html" class="menu-item">
            <span class="icon"><img src="icones/notes1.png" id="icone"></span>
            <div class="text">
                <strong>Notes</strong>
                
            </div>
        </a>
        <a href="stats.html" class="menu-item">
            <span class="icon"><img src="icones/stats1.png" id="icone"></span>
            <div class="text">
                <strong>Statistiques</strong>
                
            </div>
        </a>
        </div>
</div>

<div id="overlay" onclick="toggleMenu()"></div>

<script src="script.js"></script>
