<body>
    <header>
    <h1><a href="index.html"></a>MyTracker</h1>
    </header>
    <h2>Le site utile a ta vie</h2>
    <div id="afficheur">
    <div id="stats">
    <h4>Indice de vie : <br> 78 / 100</h4>
    <h4>Experience : <br> 7515 XP </h4>
    <h4>Streak : <br> 12 jours</h4>
    </div>
    
    <div id="temps">
        <h4>Année écoulée : <br> 62 %</h4>
        <h4>Jour de la semaine : <br> Samedi</h4>
    </div>
    </div>

    <footer>
            <div id="foot">
            <a href="index.html">Accueil</a>
            <a href="todolist.html">Tâches</a>
            <a href="timer_complet.html">Timer</a>
            <a href="stats.html">Stats</a>
            </div>
        </footer>
    

<script>
  const temps = document.getElementById("temps");
  const maintenant = new Date();
  const debutAnnee = new Date(maintenant.getFullYear(), 0, 1);
  const finAnnee = new Date(maintenant.getFullYear() + 1, 0, 1);
  const tempsEcoule = maintenant - debutAnnee;
  const dureeTotale = finAnnee - debutAnnee;
  const pourcentage = ((tempsEcoule / dureeTotale) * 100).toFixed(2) + '%';
  temps.innerHTML =`<h4>Aujourd'hui : <br> ${maintenant.toLocaleDateString('fr-FR')}</h4>
  <h4>Année écoulée : <br>${pourcentage}</h4>
  `;
  
  function getXP() {
  return JSON.parse(localStorage.getItem("XP")) || [];
}
const stats = document.getElementById("stats");
stats.innerHTML =`<h4>Indice de vie : <br> 78 / 100</h4>
    <h4>Experience : <br> ${getXP()} XP </h4>
    <h4>Streak : <br> 12 jours</h4>
  `;
</script>
