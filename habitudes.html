<style>
 *{

body{

.form-wrapper {

  .day-label {

    margin-bottom: 0.4rem;
    text-transform: uppercase;
  }



h2{
  display: flex;
  justify-content: center;
  margin: 20px;
  
  
}


.btn{
  background-color: #E2E8F0;
  border: none;
  border-radius: 6px;
  margin-top: 10px;

  font-weight: 500;
}



a {
  text-decoration: none;
  color: #007bff;
}

a:hover {
  color: #0056b3;
  text-decoration: underline;
}

}

  color: #0056b3;
}

header{
  background-color: rgb(240, 248, 255);
  padding: 15px;
  margin-bottom: 20px;
  border-bottom: 5px solid #f8f8f9;
}


footer {
  position: fixed;
  bottom: 0;

}

#icone{

}

#foot{
  padding: 7px;

  border-radius: 10px;

  align-items: center;
}








#creer{
  background-color: #2563EB;
  color: white;

}

}

#info{
  margin: 5px;
  width: 40%;
}
#sup{

  gap: 5px;

}
/* Panneau latéral du menu */
.side-menu {
    position: fixed;
    bottom: -100%; /* Caché en bas */
    right: 15px;
    background: white;
    border-radius: 20px;
    transition: bottom 0.3s ease;
    z-index: 2000;
    padding: 20px;
    box-shadow: 0 -10px 25px rgba(0,0,0,0.1);
}

.side-menu.active {
    bottom: 15px; /* Apparaît en remontant */
}

.menu-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px solid #F1F5F9;
    padding-bottom: 10px;
    color: #16A34A;
}

.close-btn {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #64748B;
}

.menu-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px;
    text-decoration: none;
    color: #1E293B;
    border-radius: 12px;
    margin-bottom: 10px;
    transition: background 0.2s;
}

.menu-item:active { background: #F1F5F9; }

.menu-item .icon { font-size: 24px; }
.menu-item strong { display: block; font-size: 1rem; }
.menu-item p { font-size: 0.75rem; color: #64748B; margin: 0; }

/* Fond sombre derrière le menu */

    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;

<body>
    <header>
    <h1><a href="index.html"></a>MyTracker</h1>
    </header>
    <div class="form-wrapper">
    <div class="add-form">
    <input type="text" id="new-habit-input" placeholder="Nouvelle habitude…" maxlength="50">
    <button id="creer" onclick="addHabit()">Créer</button>
  </div>
  </div>
    <h2>Mes habitudes</h2>
  <div class="week-grid" id="week-grid"></div>
    <div class="progress-text" id="progress-text">0 / 0 complétées</div>
  </header>

  

  <div class="habits-list" id="habits-list"></div>

  


<script>
  const now = new Date();
  const TODAY = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const DAYS_FR = [ 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam','Dim'];
  const MONTHS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

  function loadData() {
    return JSON.parse(localStorage.getItem('habitData') || '{"habits":[],"log":{}}');
  }

  function saveData(data) {
    localStorage.setItem('habitData', JSON.stringify(data));
  }
  function saveXP(XP) {
  localStorage.setItem("XP", XP);
}

function getXP() {
  return JSON.parse(localStorage.getItem("XP")) || [];
}
  function getStreak(data, habitId) {
    let streak = 0;
    let d = new Date(TODAY);
    while (true) {
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const log = data.log[key];
      if (log && log.includes(habitId)) {
        streak++;
        d.setDate(d.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  function render() {
    const data = loadData();

 
    const now = new Date();
    

    // Today's completions
    const todayLog = data.log[TODAY] || [];
    const total = data.habits.length;
    const done = todayLog.length;
   

   
    document.getElementById('progress-text').textContent = `${done} / ${total} complétée${done !== 1 ? 's' : ''}`;

    // Habits list
    const list = document.getElementById('habits-list');
    list.innerHTML = '';
    

    if (data.habits.length === 0) {
      list.innerHTML = '<div class="empty-state">Aucune habitude pour l\'instant.</div>';
    } else {
      data.habits.forEach((h, i) => {
        const isDone = todayLog.includes(h.id);
        const streak = getStreak(data, h.id);
        const item = document.createElement('div');
        const date = new Date(parseInt(h.id));
        item.className = 'habit-item' + (isDone ? ' done' : '');
       
        item.innerHTML = `
          
      
      <div id='info'>
        <h3>${h.name} </h3>
      
      ${date.toLocaleDateString('fr-FR')}
      </div>
      <div id="streak"> <h3><strong> ${streak > 0 ? `${streak} <span class="fire">🔥</span> ` : `${streak} <span class="fire">⚠️</span>   ` }</strong></h3> </div>
      <div id='sup'>

      ${isDone
        ? `<span style="color:#28a745; font-weight:bold; padding:12px 0px 0px 0px;">✓ Fait</span>`
        : `<button class='btn' onclick="toggleHabit('${h.id}')">Fait</button>`}
      <button class="btn" onclick="deleteHabit('${h.id}', event)" title="Supprimer">Supprimer</button>
      
      </div>
        `;
        
       
        list.appendChild(item);
      });
    }




    // Week grid
    renderWeek(data);
  }

  function renderWeek(data) {
    const grid = document.getElementById('week-grid');
    grid.innerHTML = '';
     const now = new Date();
  const dayOfWeek = now.getDay(); // 0=dim, 1=lun...
  const diffToMonday = (dayOfWeek === 0) ? -6 : 1 - dayOfWeek;
  const monday = new Date(now);
  monday.setDate(now.getDate() + diffToMonday);

  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const log = data.log[key] || [];

      const col = document.createElement('div');
      col.className = 'day-col';
      col.innerHTML = `
        <div>${DAYS_FR[(d.getDay() + 6) % 7]}</div>
        <div>${log.length}</div>
      `;
      grid.appendChild(col);
    }
  }

  function toggleHabit(id) {
    const data = loadData();
    if (!data.log[TODAY]) data.log[TODAY] = [];
    const idx = data.log[TODAY].indexOf(id);
    if (idx === -1) {
      data.log[TODAY].push(id);
      XP = getXP()
      XP+=5;
      saveXP(XP);
    }
    saveData(data);
    render();
  }

  function addHabit() {
    const input = document.getElementById('new-habit-input');
    const name = input.value.trim();
    if (!name) return;
    const data = loadData();
    data.habits.push({ id: Date.now().toString(), name });
    saveData(data);
    input.value = '';
    render();
  }

  function deleteHabit(id, e) {
    e.stopPropagation();
    
    const data = loadData();
    data.habits = data.habits.filter(h => h.id !== id);
    // Clean logs
    for (const day in data.log) {
      data.log[day] = data.log[day].filter(hid => hid !== id);
    }
    saveData(data);
    render();
  }

 function toggleMenu() {
    const menu = document.getElementById('moreMenu');
    const overlay = document.getElementById('overlay');
    
    if (menu.classList.contains('active')) {
        menu.classList.remove('active');
        overlay.style.display = 'none';
    } else {
        menu.classList.add('active');
        overlay.style.display = 'block';
    }
}


  render();
</script>
</body>
