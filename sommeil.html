<body>
<div class="app">
    <header>
      <h1><a href="index.html"></a>MyTracker</h1>
    </header>

  <div class="nouvelle_nuit">

    <div class="form-grid">
      
      <div class="field">
        <label>De</label>
        <input type="time" id="start-time" class="input" oninput="updatePreview()" />
      </div>
      <div class="field">
        <label>à</label>
        <input type="time" id="end-time" class="input" oninput="updatePreview()" />
      </div>
      
      
      
      <div class="field">
        
        <select id="quality" class="quality-select">
          <option value="Excellente">Excellente</option>
          <option value="Bonne" selected>Bonne</option>

    </div>

    <div class="stat-card blue"><div class="stat-value" id="stat-avg">--</div></div>
    <div class="stat-card purple"><div class="stat-value" id="stat-total">--</div></div>
  </div>
  <div class="stat-label">
    <div>Moyenne / nuit</div>

  <div class="entries-section">

<footer>
            <div id="foot">

            <a href="habitudes.html"><img src="icones/habitudes.png" id="icone"></a>
            <a href="sommeil.html"><img src="icones/sommeil.png" id="iconesommeil"></a>
            <a href="timer_complet.html"><img src="icones/timer.png" id="icone"></a>
            <a href="stats.html"><img src="icones/stats.png" id="icone"></a>

        </footer>

<script>
var STORAGE_KEY = 'sleep_entries_v2';
function calculerScore(entry) {
  var startDate = new Date(entry.start);
  
 
   var scoreQuantite = Math.min((entry.hours / 8) * 80, 80);
var coefQualite = { 'Excellente': 1.0, 'Bonne': 0.85, 'Moyenne': 0.6, 'Mauvaise': 0.4 }[entry.quality] || 0.85;
 
  var hC = startDate.getHours(), mC = startDate.getMinutes();
   var coucherMin = (hC < 12 ? hC + 24 : hC) * 60 + mC;
  var cibleMin = 23 * 60;
  // Se coucher avant la cible = plein score, après = pénalité
  var diff = coucherMin <= cibleMin ? 0 : coucherMin - cibleMin;
  var scoreRegularite = diff <= 30 ? 20 : diff <= 60 ? 10 : diff <= 90 ? 5 : 0;
 




return Math.round((scoreQuantite + scoreRegularite) * coefQualite);
}


function scoreClass(s) {
  if (s >= 80) return 'score-s80';
  if (s >= 65) return 'score-s65';
  if (s >= 50) return 'score-s50';
  if (s >= 35) return 'score-s35';
  return 'score-s0';
}

function pad(n) { return String(n).padStart(2, '0'); }

function getTodayStr() {
  var now = new Date();
  now.setDate(now.getDate() - 1);
  return now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate());
}
 
function initDefaults() {
  document.getElementById('start-time').value = '23:00';
  document.getElementById('end-time').value = '06:20';
  updatePreview();
}
 
function getStartEnd() {
  var date = getTodayStr();
  var st = document.getElementById('start-time').value;
  var et = document.getElementById('end-time').value;
  if (!st || !et) return null;
 
  var start = new Date(date + 'T' + st);
  var end = new Date(date + 'T' + et);
  // Si heure fin <= heure début, on considère que le réveil est le lendemain
  if (end <= start) { end.setDate(end.getDate() + 1); }
  return { start: start, end: end, date: date };
}

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e) { return []; }
}
function save(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 2500);
}

function formatHours(h) {
  var hh = Math.floor(h);
  var mm = Math.round((h - hh) * 60);
  return mm > 0 ? hh + 'h' + pad(mm) : hh + 'h';
}

function formatDT(str) {
  var d = new Date(str);
  return pad(d.getDate()) + '/' + pad(d.getMonth()+1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function qualityClass(q) {
  var map = { 'Excellente': 'q-excellent', 'Bonne': 'q-bonne', 'Moyenne': 'q-moyenne', 'Mauvaise': 'q-mauvaise' };
  return map[q] || 'q-bonne';
}

function barClass(h) {
  if (h >= 8) return 'good';
  if (h >= 6) return 'ok';
  return 'bad';
}

function updatePreview() {
  var el = document.getElementById('duration-preview');
  var times = getStartEnd();
  if (!times) { el.textContent = ''; return; }
  var diff = (times.end - times.start) / 3600000;
  if (diff <= 0 || diff > 24) {
    el.textContent = 'Durée invalide';
    el.className = 'duration-preview err';
  } else {

    el.textContent = 'Sommeil : ' + formatHours(diff);
    el.className = 'duration-preview';
  }
}

function addEntry() {
  var date = getTodayStr();
  var quality = document.getElementById('quality').value;
  var times = getStartEnd();
  if (!times) { toast('Remplis tous les champs'); return; }
  var hours = (times.end - times.start) / 3600000;
  if (hours <= 0 || hours > 24) { toast('Vérifie les heures'); return; }
 
  var data = load();
  // Vérifier si une entrée existe déjà pour aujourd'hui (même date de début)
  for (var i = 0; i < data.length; i++) {
    var entryDate = new Date(data[i].start);
    var entryDateStr = entryDate.getFullYear() + '-' + pad(entryDate.getMonth()+1) + '-' + pad(entryDate.getDate());
    if (entryDateStr === date) { toast('Nuit déjà enregistrée aujourd\'hui !'); return; }
  }
  var id = date + 'T' + document.getElementById('start-time').value;
  data.push({
    id: id,
    start: times.start.toISOString(),
    end: times.end.toISOString(),
    hours: hours,
    quality: quality
  });
  data.sort(function(a, b) { return b.start.localeCompare(a.start); });
  save(data);
  render();
  toast('Nuit ajoutée !');
}



function render() {
  var data = load();

  if (data.length === 0) {
    document.getElementById('stat-avg').textContent = '--';
    document.getElementById('stat-total').textContent = '--';
    
  } else {
    var hours = data.map(function(e) { return e.hours; });
    var sum = hours.reduce(function(a,b){return a+b;}, 0);
    document.getElementById('stat-avg').textContent = formatHours(sum / hours.length);
    document.getElementById('stat-total').textContent = data.length;
    
  }

  

  var list = document.getElementById('entries-list');
  if (data.length === 0) {
    list.innerHTML = '<div class="empty-state">Aucune nuit enregistrée<br>Commence par ajouter ta première nuit !</div>';
    return;
  }
  var html = '';
  for (var k = 0; k < data.length; k++) {
    var entry = data[k];
    var safeId = entry.id.replace(/'/g, '');
    var d = new Date(entry.start);
    var dayStr = pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear();
    var days = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    var dayName = days[d.getDay()];
    var startTime = pad(new Date(entry.start).getHours()) + ':' + pad(new Date(entry.start).getMinutes());
    var endTime   = pad(new Date(entry.end).getHours())   + ':' + pad(new Date(entry.end).getMinutes());
    var score = calculerScore(entry);
    var supprBtn = k === 0 ? '<button class="delete-btn" onclick="deleteLastEntry()" style="background:white;color:black;border:black solid 1px;border-radius:6px;padding:3px 6px;font-size:12px;cursor:pointer;">✕</button>' : '';
    
html += '<div class="entry-row">' + 
      '<div class="info"><div class="entry-dayname">' + dayName + '</div><div class="entry-datestr">' + dayStr + '</div>'+'</div>' +
      
      '<div class="heurenuit">' + formatHours(entry.hours) + '</div>'+
      
      '<div class="heuresnuit">' + '<div style="display:flex;align-items:center;gap:5px;"><div class="score-badge ' + scoreClass(score) + '">' + score + '/100</div>' + supprBtn + '</div>' + startTime + ' → ' + endTime + '</div>' +
      
      
    '</div>';
  }
  list.innerHTML = html;
}

// Dans la page (sommeil.html par exemple)
async function programmerRappelSommeil() {
  const reg = await navigator.serviceWorker.ready;

  const maintenant = new Date();
  const demain7h = new Date();
  demain7h.setDate(maintenant.getDate() );
  demain7h.setHours(22, 45, 0, 0);

  const delai = demain7h - maintenant; // en ms

  // On envoie le délai au SW
  reg.active.postMessage({
    type: "PROGRAMMER_RAPPEL",
    delai,
    titre: "Sommeil 🌙",
    body: "Tu n'as pas encore renseigné ta nuit !"
  });
}


function deleteLastEntry() {
  var data = load();
  if (data.length === 0) return;
  data.shift(); // supprime le premier élément (le plus récent, vu le tri)
  save(data);
  render();
  toast('Dernière nuit supprimée.');
}


initDefaults();
render();

</script>
</body>
</html>
