<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes tâches</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <h1><a href="index.html"></a>MyTracker</h1>
    </header>
    
    <div id="nouvelle_tache">
        <input type="text" id="new_tache" class="input" placeholder="Nouvelle tâche">
        <select id="categories" class="input">
            <option value="études">🎓 Etudes</option>
            <option value="perso">👨 Perso</option>
            <option value="loisirs">🎯 Loisirs</option>
        </select>
        <label class="custom-checkbox">
  <input id="important" type="checkbox">
  <span class="checkbox-text">Important</span>
</label>
        <div class="slider-container">
            <label for="dureeRange">Durée :</label>
            <input type="range" id="dureeRange" min="1" max="3" step="1" value="2">
            <div class="labels">
                <span>Court</span>
                <span>Moyen</span>
                <span>Long</span>
            </div>
        </div>
        <input type="date" name="" id="" class="input"> 
        <button type="button" id='creer' onclick="creer_tache()">Créer</button>
        
        
     </div>
     <div id="container"></div>


     

        <footer>
           <div id="foot">
            <a href="index.html"><img src="icones/home.png" id="icone"></a>
            <a href="todolist.html"><img src="icones/taches.png" id="icone"></a>
            <a href="habitudes.html"><img src="icones/habitudes.png" id="icone"></a>
            <a href="index.html"><img src="icones/sommeil.png" id="icone"></a>
            <a href="timer_complet.html"><img src="icones/timer.png" id="icone"></a>
            <a href="stats.html"><img src="icones/stats.png" id="icone"></a>
            
            </div>
        
        </footer>

<script src="script.js"></script>
</body>
</html>
