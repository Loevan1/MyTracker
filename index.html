<script>



  const temps = document.getElementById("temps");
  const maintenant = new Date();
  const debutAnnee = new Date(maintenant.getFullYear(), 0, 1);
  const finAnnee = new Date(maintenant.getFullYear() + 1, 0, 1);
  const tempsEcoule = maintenant - debutAnnee;
  const dureeTotale = finAnnee - debutAnnee;
  const pourcentage = ((tempsEcoule / dureeTotale) * 100).toFixed(2) + '%';
  temps.innerHTML =`<h4>Aujourd'hui : <br> ${maintenant.toLocaleDateString('fr-FR')}</h4>
  <h4>Année écoulée : <br>${pourcentage}</h4>
  `;
  
  function getXP() {
  return JSON.parse(localStorage.getItem("XP")) || [];
}
function saveXP(XP) {
  localStorage.setItem("XP", XP);
}

const stats = document.getElementById("stats");
function calculerScoreSommeil() {
  try {
    var data = JSON.parse(localStorage.getItem('sleep_entries_v2')) || [];
    if (data.length === 0) return null;
    var entry = data[0];
    var startDate = new Date(entry.start);
    var scoreQuantite = Math.min((entry.hours / 8) * 80, 80);
    var coefQualite = { 'Excellente': 1.0, 'Bonne': 0.85, 'Moyenne': 0.6, 'Mauvaise': 0.4 }[entry.quality] || 0.85;
    var hC = startDate.getHours(), mC = startDate.getMinutes();
    var coucherMin = (hC < 12 ? hC + 24 : hC) * 60 + mC;
  var cibleMin = 23 * 60;
  // Se coucher avant la cible = plein score, après = pénalité
  var diff = coucherMin <= cibleMin ? 0 : coucherMin - cibleMin;
    var scoreRegularite = diff <= 30 ? 20 : diff <= 60 ? 10 : diff <= 90 ? 5 : 0;
    return Math.round((scoreQuantite + scoreRegularite) * coefQualite);
  } catch(e) { return null; }
}
 
function calculerIndiceVie() {
  var scoreSommeil = calculerScoreSommeil();
  if (scoreSommeil === null) return null;
  return scoreSommeil;
}
 
function refresh(){
  var indice = calculerIndiceVie();
  var indiceStr = indice !== null ? indice + ' / 100' : '-- / 100';
  stats.innerHTML =`<h4>Indice de vie : <br> ${indiceStr}</h4>
    <h4>Experience : <br> ${getXP()} XP </h4>
    <h4 id='streak'>Streak : <br> 12 jours</h4>
  `;
}
refresh();
function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getYesterdayStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function loadStreak() {
  return {
    count: parseInt(localStorage.getItem('streak_count') || '0'),
    lastDate: localStorage.getItem('streak_last_date') || '',
  };
}

function checkInStreak() {
  const today = getTodayStr();
  const { count, lastDate } = loadStreak();

  // Déjà cliqué aujourd'hui → on bloque
  if (lastDate === today) return null;

  let newCount;
  if (lastDate === getYesterdayStr()) {
    // Hier = dernier check-in → on continue la streak
    newCount = count + 1;
    XP = getXP()
    XP+=2;
    saveXP(XP);
    refresh();
  } else {
    // Cassée ou première fois → on repart à 1
    newCount = 1;
    XP = getXP()
    XP+=2;
    saveXP(XP);
    refresh();
  }

  localStorage.setItem('streak_count', newCount);
  localStorage.setItem('streak_last_date', today);

  return newCount;
}

function updateStreakUI(){
  const today = getTodayStr();
  const { count, lastDate } = loadStreak();
  const alreadyDone = lastDate === today;

  const btn = document.getElementById('streak-btn');
  const display = document.getElementById('streak');

  display.innerHTML = ` Streak :<br>  ${count} 🔥`;

  if (alreadyDone) {
    btn.textContent = '✅ Validé';
    btn.disabled = true;
  } else {
    btn.textContent = 'Valider ma journée';
    btn.disabled = false;
  }
}

document.getElementById('streak-btn').addEventListener('click', () => {
  const result = checkInStreak();
  if (result !== null) updateStreakUI();
});



const citations = [

  { texte: "L'avenir appartient à ceux qui croient en la beauté de leurs rêves.", auteur: "Eleanor Roosevelt" },

  { texte: "On ne voit bien qu'avec le cœur. L'essentiel est invisible pour les yeux.", auteur: "Antoine de Saint-Exupéry" },
  { texte: "Chaque jour est une nouvelle chance de changer votre vie.", auteur: "Anonyme" },

  { texte: "Peu importe la lenteur de ta progression, tu as toujours une longueur d'avance sur ceux qui n'essaient pas.", auteur: "Confucius" },
  { texte: "Ce n'est pas la destination qui compte, c'est le voyage.", auteur: "Ralph Waldo Emerson" },
];
 
// Époque de référence : 1er janvier 2026
const EPOCH = new Date(2026, 0, 1);
const MS_PAR_JOUR = 86400000;
 
function joursDepuisEpoch(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  return Math.floor((d - EPOCH) / MS_PAR_JOUR);
}
 
function dateDeJour(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d;
}
 
const totalCitations = citations.length;
let offsetJour = 0;
 
function indexDuJour(date) {
  return ((joursDepuisEpoch(date) % totalCitations) + totalCitations) % totalCitations;
}
 

function render() {
  const date = dateDeJour(offsetJour);
  const idx  = indexDuJour(date);
  const cite = citations[idx];
 
 
  // Quote

 
  document.getElementById('quoteText').textContent = cite.texte;
  document.getElementById('quoteAuthor').textContent = cite.auteur;
}
function toggleMenu() {
    const menu = document.getElementById('moreMenu');
    const overlay = document.getElementById('overlay');
    
    if (menu.classList.contains('active')) {
        menu.classList.remove('active');
        overlay.style.display = 'none';
    } else {
        menu.classList.add('active');
        overlay.style.display = 'block';
    }
}

// Au chargement de la page

if ("serviceWorker" in navigator) {
