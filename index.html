<script>



  const temps = document.getElementById("temps");
  const maintenant = new Date();
  const debutAnnee = new Date(maintenant.getFullYear(), 0, 1);
  const finAnnee = new Date(maintenant.getFullYear() + 1, 0, 1);
  const tempsEcoule = maintenant - debutAnnee;
  const dureeTotale = finAnnee - debutAnnee;
  const pourcentage = ((tempsEcoule / dureeTotale) * 100).toFixed(2) + '%';
  temps.innerHTML =`<h4>Aujourd'hui : <br> ${maintenant.toLocaleDateString('fr-FR')}</h4>
  <h4>Année écoulée : <br>${pourcentage}</h4>
  `;
  
  function getXP() {
  return JSON.parse(localStorage.getItem("XP")) || [];
}
function saveXP(XP) {
  localStorage.setItem("XP", XP);
}

const stats = document.getElementById("stats");
function calculerScoreSommeil() {
  try {
    var data = JSON.parse(localStorage.getItem('sleep_entries_v2')) || [];
    if (data.length === 0) return null;
    var entry = data[0];
    var startDate = new Date(entry.start);
    var scoreQuantite = Math.min((entry.hours / 8) * 80, 80);
    var coefQualite = { 'Excellente': 1.0, 'Bonne': 0.85, 'Moyenne': 0.6, 'Mauvaise': 0.4 }[entry.quality] || 0.85;
    var hC = startDate.getHours(), mC = startDate.getMinutes();
    var diff = Math.abs((hC * 60 + mC) - (23 * 60));
    var scoreRegularite = diff <= 30 ? 20 : diff <= 60 ? 10 : diff <= 90 ? 5 : 0;
    return Math.round((scoreQuantite + scoreRegularite) * coefQualite);
  } catch(e) { return null; }
}
 
function calculerIndiceVie() {
  var scoreSommeil = calculerScoreSommeil();
  if (scoreSommeil === null) return null;
  return scoreSommeil;
}
 
function refresh(){
  var indice = calculerIndiceVie();
  var indiceStr = indice !== null ? indice + ' / 100' : '-- / 100';
  stats.innerHTML =`<h4>Indice de vie : <br> ${indiceStr}</h4>
    <h4>Experience : <br> ${getXP()} XP </h4>
    <h4 id='streak'>Streak : <br> 12 jours</h4>
  `;
}
refresh();
function getTodayStr() {
  return new Date().toISOString().slice(0, 10); // "2026-03-15"
}

function getYesterdayStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0, 10);
}

function loadStreak() {
  return {
    count: parseInt(localStorage.getItem('streak_count') || '0'),
    lastDate: localStorage.getItem('streak_last_date') || '',
  };
}

function checkInStreak() {
  const today = getTodayStr();
  const { count, lastDate } = loadStreak();

  // Déjà cliqué aujourd'hui → on bloque
  if (lastDate === today) return null;

  let newCount;
  if (lastDate === getYesterdayStr()) {
    // Hier = dernier check-in → on continue la streak
    newCount = count + 1;
    XP = getXP()
    XP+=2;
    saveXP(XP);
    refresh();
  } else {
    // Cassée ou première fois → on repart à 1
    newCount = 1;
    XP = getXP()
    XP+=2;
    saveXP(XP);
    refresh();
  }

  localStorage.setItem('streak_count', newCount);
  localStorage.setItem('streak_last_date', today);

  return newCount;
}

function updateStreakUI(){
  const today = getTodayStr();
  const { count, lastDate } = loadStreak();
  const alreadyDone = lastDate === today;

  const btn = document.getElementById('streak-btn');
  const display = document.getElementById('streak');

  display.innerHTML = ` Streak :<br>  ${count} 🔥`;

  if (alreadyDone) {
    btn.textContent = '✅ Validé';
    btn.disabled = true;
  } else {
    btn.textContent = 'Valider ma journée';
    btn.disabled = false;
  }
}

document.getElementById('streak-btn').addEventListener('click', () => {
  const result = checkInStreak();
  if (result !== null) updateStreakUI();
});





// Au chargement de la page
updateStreakUI();

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/Site---MyTracker/service-worker.js");
  }

</script>
